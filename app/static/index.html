<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NotebookLM 桌面版</title>
<link rel="stylesheet" href="/static/style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='45' fill='%23cc785c'/></svg>">
</head>
<body>

<!-- Anthropic 四芒星标记（DESIGN.md 品牌字形） -->
<svg style="display:none">
  <symbol id="spike" viewBox="0 0 24 24">
    <path d="M12 1.5 13.9 9.3 20.4 4.8 15.9 11.3 23.7 13.2 15.9 12.7 20.4 19.2 13.9 14.7 12 22.5 10.1 14.7 3.6 19.2 8.1 12.7 0.3 13.2 8.1 11.3 3.6 4.8 10.1 9.3Z"/>
  </symbol>
  <!-- 线性图标，统一 24x24 / 描边 1.8 / 圆头圆角 -->
  <symbol id="i-copy" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <rect x="9" y="9" width="11" height="11" rx="2.5"/>
    <path d="M5.5 15H5a1.5 1.5 0 0 1-1.5-1.5v-9A1.5 1.5 0 0 1 5 3h9A1.5 1.5 0 0 1 15.5 4.5V5"/>
  </symbol>
  <symbol id="i-check" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4.5 12.5 9.5 17.5 19.5 6.5"/>
  </symbol>
  <symbol id="i-note" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M19.5 12.5V19a1.5 1.5 0 0 1-1.5 1.5H6A1.5 1.5 0 0 1 4.5 19V6A1.5 1.5 0 0 1 6 4.5h6.5"/>
    <path d="M16.2 3.8a1.9 1.9 0 0 1 2.7 2.7l-7.2 7.2-3.4.7.7-3.4Z"/>
  </symbol>
  <symbol id="i-download" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 3.5v11M7.5 10.5 12 15l4.5-4.5"/>
    <path d="M4.5 16.5v2A2 2 0 0 0 6.5 20.5h11a2 2 0 0 0 2-2v-2"/>
  </symbol>
  <symbol id="i-warn" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="8.5"/>
    <path d="M12 7.8v5"/><path d="M12 16.1h.01"/>
  </symbol>
  <symbol id="i-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M5 12h13M12.5 6.5 19 12l-6.5 5.5"/>
  </symbol>
</svg>

<div id="app">

  <!-- ==================== 左栏 ==================== -->
  <aside class="sidebar">
    <div class="brand">
      <svg class="spike"><use href="#spike"/></svg>
      <div>
        <div class="brand-name">Notebook</div>
        <div class="brand-sub" id="account">连接中…</div>
        <div class="brand-sub build" id="build"></div>
      </div>
    </div>

    <button class="btn-new" onclick="createNotebook()">＋ 新建笔记本</button>

    <input class="search" id="search" placeholder="搜索笔记本" oninput="renderNotebooks()">

    <div class="nb-list" id="nbList"><div class="empty">加载中…</div></div>
  </aside>

  <!-- ==================== 中栏 ==================== -->
  <main class="main">
    <header class="topbar">
      <div class="title-wrap">
        <h1 id="nbTitle">选择一个笔记本</h1>
        <div class="sub" id="nbSub"></div>
      </div>
      <div class="top-actions">
        <button class="btn-secondary" onclick="openShare()" title="共享给其他人">共享</button>
        <button class="btn-secondary" onclick="openSettings()" title="回答长度与风格">对话设置</button>
        <button class="btn-secondary" onclick="openFolder()" title="打开下载文件夹">下载目录</button>
        <button class="btn-secondary" onclick="togglePanel()" id="panelBtn">资料与生成</button>
      </div>
    </header>

    <div class="chat" id="chat">
      <div class="welcome">
        <svg class="mark"><use href="#spike"/></svg>
        <h2>和你的资料对话</h2>
        <p>从左侧选一个笔记本，或新建一个并添加资料。<br>
           每个回答都基于你自己的来源，并附带引用。</p>
      </div>
    </div>

    <div class="suggest" id="suggest"></div>

    <div class="composer">
      <textarea id="input" rows="1"
        placeholder="问点什么…（Enter 发送，Shift+Enter 换行）"
        onkeydown="onKey(event)" oninput="autoGrow(this)" disabled></textarea>
      <button id="sendBtn" onclick="send()" disabled>发送</button>
    </div>
  </main>

  <!-- ==================== 右栏 ==================== -->
  <aside class="panel" id="panel">
    <div class="tabs">
      <button class="tab active" id="tab-sources" onclick="switchTab('sources')">资料</button>
      <button class="tab" id="tab-studio"  onclick="switchTab('studio')">生成</button>
      <button class="tab" id="tab-research" onclick="switchTab('research')">研究</button>
      <button class="tab" id="tab-notes"   onclick="switchTab('notes')">笔记</button>
    </div>

    <!-- 资料 -->
    <section class="tabpage active" id="page-sources">
      <p class="sec-label">添加来源</p>
      <div class="add-row">
        <input id="urlInput" placeholder="网址 / YouTube 链接">
        <button onclick="addUrl()">添加</button>
      </div>
      <label class="filebtn">
        上传文件（PDF · Word · 音频 · 图片）
        <input type="file" id="fileInput" onchange="addFile(this)" hidden>
      </label>
      <button class="linklike" onclick="addTextPrompt()">粘贴一段文字</button>

      <p class="sec-label">当前资料</p>
      <div class="list" id="srcList"><div class="empty">未选择笔记本</div></div>

      <div class="sec-head" style="margin-top:24px">
        <p class="sec-label">标签</p>
        <span>
          <button class="mini" onclick="autoLabel()" title="让 AI 自动分类">自动分类</button>
          <button class="mini" onclick="addLabel()">新建</button>
        </span>
      </div>
      <div id="labelList" class="tags"></div>
    </section>

    <!-- 生成 -->
    <section class="tabpage" id="page-studio">
      <p class="sec-label">补充要求（可选）</p>
      <input id="genIns" class="gen-ins" placeholder="例如：用中文，风格轻松一些">

      <p class="sec-label">音视频</p>
      <div class="grid">
        <button class="gen" onclick="gen('audio')"><b>播客</b><span>音频概览 MP3</span></button>
        <button class="gen" onclick="gen('video')"><b>视频</b><span>视频概览 MP4</span></button>
      </div>

      <p class="sec-label">文档</p>
      <div class="grid">
        <button class="gen" onclick="gen('study')"><b>学习指南</b><span>Markdown</span></button>
        <button class="gen" onclick="gen('briefing')"><b>简报</b><span>Markdown</span></button>
        <button class="gen" onclick="gen('blog')"><b>博客稿</b><span>Markdown</span></button>
        <button class="gen" onclick="gen('concept')"><b>概念解释</b><span>Markdown</span></button>
      </div>

      <p class="sec-label">学习与图表</p>
      <div class="grid">
        <button class="gen" onclick="gen('quiz')"><b>测验</b><span>题目与答案</span></button>
        <button class="gen" onclick="gen('flashcards')"><b>闪卡</b><span>背诵卡片</span></button>
        <button class="gen" onclick="gen('mindmap')"><b>思维导图</b><span>JSON</span></button>
        <button class="gen" onclick="gen('slides')"><b>幻灯片</b><span>PDF</span></button>
        <button class="gen" onclick="gen('infographic')"><b>信息图</b><span>PNG</span></button>
        <button class="gen" onclick="gen('datatable')"><b>数据表</b><span>CSV</span></button>
      </div>

      <div class="sec-head" style="margin-top:28px">
        <p class="sec-label">已生成的内容</p>
        <button class="mini" onclick="loadArtifacts()">刷新</button>
      </div>
      <div class="list" id="artList"><div class="empty">未选择笔记本</div></div>

      <div class="tasks" id="tasks"></div>
    </section>

    <!-- 研究 -->
    <section class="tabpage" id="page-research">
      <p class="sec-label">联网研究</p>
      <p class="hint">让 Gemini 自动上网搜集资料，挑选后一键导入这个笔记本。</p>
      <div class="seg">
        <button class="on" id="mode-fast" onclick="setMode('fast')">快速</button>
        <button id="mode-deep" onclick="setMode('deep')">深度</button>
      </div>
      <div class="add-row">
        <input id="rqInput" placeholder="研究主题，例如：2026 年 AI Agent 进展">
        <button onclick="startResearch()">开始</button>
      </div>
      <div id="rResult"></div>
    </section>

    <!-- 笔记 -->
    <section class="tabpage" id="page-notes">
      <p class="sec-label">已保存的笔记</p>
      <div class="list" id="noteList"><div class="empty">未选择笔记本</div></div>
    </section>
  </aside>

</div>

<!-- 输入弹层（替代 prompt，保持设计一致） -->
<div class="mask" id="mask" onclick="if(event.target===this)closeDialog()">
  <div class="dialog">
    <h3 id="dlgTitle">标题</h3>
    <p id="dlgDesc"></p>
    <input id="dlgInput">
    <textarea id="dlgArea" style="display:none"></textarea>
    <div class="dialog-actions">
      <button class="no" onclick="closeDialog()">取消</button>
      <button class="ok" onclick="confirmDialog()">确定</button>
    </div>
  </div>
</div>

<!-- 对话设置 -->
<div class="mask" id="cfgMask" onclick="if(event.target===this)closeSettings()">
  <div class="dialog">
    <h3>对话设置</h3>
    <p>控制回答的长度与风格，对当前笔记本生效。</p>

    <p class="sec-label">回答长度</p>
    <div class="seg" id="segLen">
      <button data-v="shorter" onclick="pickLen(this)">简短</button>
      <button data-v="default" class="on" onclick="pickLen(this)">默认</button>
      <button data-v="longer" onclick="pickLen(this)">详尽</button>
    </div>

    <p class="sec-label" style="margin-top:20px">回答风格</p>
    <div class="seg" id="segGoal">
      <button data-v="default" class="on" onclick="pickGoal(this)">标准</button>
      <button data-v="learning_guide" onclick="pickGoal(this)">学习引导</button>
      <button data-v="custom" onclick="pickGoal(this)">自定义</button>
    </div>

    <div id="cfgCustomWrap" style="display:none;margin-top:16px">
      <p class="sec-label">自定义人设</p>
      <textarea id="cfgCustom" placeholder="例如：你是一位耐心的老师，用通俗的比喻讲解，每次回答都先给结论再展开。"></textarea>
    </div>

    <div class="dialog-actions" style="margin-top:8px">
      <button class="no" onclick="closeSettings()">取消</button>
      <button class="ok" onclick="saveSettings()">保存</button>
    </div>
  </div>
</div>

<!-- 通用信息弹层 -->
<div class="mask" id="infoMask" onclick="if(event.target===this)closeInfo()">
  <div class="dialog wide">
    <h3 id="infoTitle"></h3>
    <div id="infoBody" class="info-body"></div>
    <div class="dialog-actions">
      <button class="ok" onclick="closeInfo()">关闭</button>
    </div>
  </div>
</div>

<!-- 生成配置 -->
<div class="mask" id="genMask" onclick="if(event.target===this)closeGen()">
  <div class="dialog wide">
    <h3 id="genTitle">生成</h3>
    <div id="genBody" class="info-body"></div>
    <div class="dialog-actions">
      <button class="no" onclick="closeGen()">取消</button>
      <button class="ok" onclick="runGen()">开始生成</button>
    </div>
  </div>
</div>

<!-- 共享 -->
<div class="mask" id="shareMask" onclick="if(event.target===this)closeShare()">
  <div class="dialog">
    <h3>共享笔记本</h3>
    <p>把这个笔记本共享给其他 Google 账号。</p>

    <label class="chk" style="margin:12px 0">
      <input type="checkbox" id="sharePublic" disabled>
      <span>已生成公开链接</span>
    </label>

    <p class="sec-label">添加成员</p>
    <div class="add-row">
      <input id="shareEmail" placeholder="对方的 Google 邮箱" style="flex:1">
      <select id="shareRole">
        <option value="viewer">可查看</option>
        <option value="editor">可编辑</option>
      </select>
      <button onclick="addShareUser()">添加</button>
    </div>

    <p class="sec-label" style="margin-top:20px">已共享给</p>
    <div class="list" id="shareUsers"></div>

    <div class="dialog-actions">
      <button class="ok" onclick="closeShare()">关闭</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script type="module" src="/static/app.js"></script>
</body>
</html>
